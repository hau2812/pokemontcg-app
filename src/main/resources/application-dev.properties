spring.application.name=tcg

# Server Port
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:tcgdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Access via http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Admin credentials (Hardcoded for MVP)
app.admin.token=SECRET_ADMIN_TOKEN_123
app.admin.username=admin
app.admin.password=admin123

# Base URL (dùng cho link xác nhận email)
app.base-url=http://localhost:8080

