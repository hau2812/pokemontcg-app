<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PikaRyu TCG</title>
    <link rel="stylesheet" href="./style.css?v=7" />
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <!-- Axios -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
const { useState, useEffect, useMemo } = React;

const API_BASE_URL = '/api';

const formatCurrency = (value) => {
  return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(value);
};

// ==========================================
// STOREFRONT COMPONENT
// ==========================================
const Storefront = ({ navigateTo }) => {
  const [products, setProducts] = useState([]);
  const [categories, setCategories] = useState([]);
  const [banners, setBanners] = useState([]);
  const [currentBannerIndex, setCurrentBannerIndex] = useState(0);
  const [selectedCategory, setSelectedCategory] = useState(null);
  const [searchQuery, setSearchQuery] = useState('');
  const [showGradingModal, setShowGradingModal] = useState(false);
  const [loading, setLoading] = useState(true);
  const [theme, setTheme] = useState(localStorage.getItem('theme') || 'light');

  React.useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }, [theme]);

  const toggleTheme = () => {
    setTheme(theme === 'light' ? 'dark' : 'light');
  };
  const [cart, setCart] = useState({});
  const [showCartModal, setShowCartModal] = useState(false);
  const [showCheckout, setShowCheckout] = useState(false);
  const [sortOption, setSortOption] = useState('default');
  const [currentPage, setCurrentPage] = useState(1);
  const itemsPerPage = 10;
  const [phone, setPhone] = useState('');
  const [phoneError, setPhoneError] = useState('');
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [orderSuccess, setOrderSuccess] = useState(null);
  
  const [gradingPolicy, setGradingPolicy] = useState(null);
  
  // Product Detail Modal States
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [showProductDetailModal, setShowProductDetailModal] = useState(false);
  const [galleryActiveIndex, setGalleryActiveIndex] = useState(0);

  const openProductDetail = (product) => {
    setSelectedProduct(product);
    setGalleryActiveIndex(0);
    setShowProductDetailModal(true);
  };

  const closeProductDetail = () => {
    setShowProductDetailModal(false);
    setTimeout(() => setSelectedProduct(null), 300);
  };

  const [error, setError] = useState(null);

  useEffect(() => {
    const fetchData = async () => {
      try {
        const [prodRes, catRes, bannerRes] = await Promise.all([
          axios.get(`${API_BASE_URL}/public/products`, { timeout: 15000 }),
          axios.get(`${API_BASE_URL}/public/categories`, { timeout: 15000 }),
          axios.get(`${API_BASE_URL}/public/banners`, { timeout: 15000 })
        ]);
        setProducts(prodRes.data);
        setCategories(catRes.data);
        setBanners(bannerRes.data);

        axios.get(`${API_BASE_URL}/public/settings/gradingPolicy`)
             .then(res => {
               if (res.data && res.data.value) setGradingPolicy(JSON.parse(res.data.value));
             })
             .catch(err => console.error("No policy found", err));
      } catch (err) {
        console.error("Error fetching data:", err);
        setError("Không thể kết nối đến máy chủ. Hệ thống đang bảo trì hoặc đang bị gián đoạn, vui lòng thử lại sau ít phút.");
      } finally {
        setLoading(false);
      }
    };
    fetchData();
  }, []);

  useEffect(() => {
    if (banners.length <= 1) return;
    const interval = setInterval(() => {
      setCurrentBannerIndex(prev => (prev + 1) % banners.length);
    }, 5000);
    return () => clearInterval(interval);
  }, [banners.length]);

  const { totalPrice, totalItems } = useMemo(() => {
    let total = 0, itemsCount = 0;
    Object.entries(cart).forEach(([productId, quantity]) => {
      if (quantity > 0) {
        const product = products.find(p => p.id === parseInt(productId));
        if (product) {
          total += product.price * quantity;
          itemsCount += quantity;
        }
      }
    });
    return { totalPrice: total, totalItems: itemsCount };
  }, [cart, products]);

  const handleQuantityChange = (productId, delta) => {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    setCart(prev => {
      const newQty = (prev[productId] || 0) + delta;
      if (newQty < 0 || newQty > product.stockQuantity) return prev;
      return { ...prev, [productId]: newQty };
    });
  };

  const handleCheckout = async () => {
    if (!/^(0[3|5|7|8|9])+([0-9]{8})$/.test(phone)) {
      setPhoneError('Số điện thoại không hợp lệ');
      return;
    }
    setPhoneError(''); setIsSubmitting(true);
    const items = Object.entries(cart).filter(([_, qty]) => qty > 0).map(([id, qty]) => ({ productId: parseInt(id), quantity: qty }));
    try {
      const response = await axios.post(`${API_BASE_URL}/public/orders`, { phone, items });
      setOrderSuccess(response.data); setShowCheckout(false); setCart({});
    } catch (error) {
      alert((error.response && error.response.status === 409) ? "Sản phẩm đã hết hàng." : "Lỗi khi đặt hàng.");
    } finally {
      setIsSubmitting(false);
    }
  };

  useEffect(() => {
    setCurrentPage(1);
  }, [selectedCategory, searchQuery]);

  const filteredProducts = products.filter(p => {
    const matchCategory = selectedCategory ? (p.category && p.category.id === selectedCategory) : true;
    const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCategory && matchSearch;
  });

  const applySort = (list) => {
    if (sortOption === 'price_asc') return [...list].sort((a, b) => a.price - b.price);
    if (sortOption === 'price_desc') return [...list].sort((a, b) => b.price - a.price);
    return list;
  };

  const sortControl = (
    <div style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
      <span style={{color: 'var(--text-secondary)', fontSize: '0.9rem'}}><i className="fa-solid fa-arrow-down-a-z"></i> Sắp xếp:</span>
      <select style={{padding: '0.4rem 0.8rem', background: 'var(--input-bg)', color: 'var(--text-primary)', border: '1px solid var(--input-border)', borderRadius: '6px', cursor: 'pointer', outline: 'none', fontSize: '0.9rem'}} value={sortOption} onChange={(e) => setSortOption(e.target.value)}>
        <option value="default" style={{background: 'var(--input-bg)', color: 'var(--text-primary)'}}>Mặc định</option>
        <option value="price_asc" style={{background: 'var(--input-bg)', color: 'var(--text-primary)'}}>Giá tăng dần</option>
        <option value="price_desc" style={{background: 'var(--input-bg)', color: 'var(--text-primary)'}}>Giá giảm dần</option>
      </select>
    </div>
  );

  if (loading) return <div className="loader"></div>;

  if (error) {
    return (
      <div className="container" style={{paddingTop: '5rem', minHeight: '60vh', display: 'flex', justifyContent: 'center', alignItems: 'center'}}>
        <div style={{textAlign: 'center', background: 'var(--card-bg)', padding: '3rem', borderRadius: '16px', border: '1px solid var(--glass-border)', maxWidth: '500px'}}>
          <i className="fa-solid fa-server" style={{fontSize: '4rem', color: '#ef4444', marginBottom: '1.5rem', opacity: 0.8}}></i>
          <h2 style={{color: 'var(--text-primary)', marginBottom: '1rem'}}>Lỗi Kết Nối Máy Chủ</h2>
          <p style={{color: 'var(--text-secondary)', lineHeight: '1.6', marginBottom: '2rem'}}>{error}</p>
          <button className="btn-primary" onClick={() => window.location.reload()}><i className="fa-solid fa-rotate-right"></i> Tải Lại Trang</button>
        </div>
      </div>
    );
  }

  if (orderSuccess) {
    const qrUrl = `https://img.vietqr.io/image/970407-19031234567890-compact2.png?amount=${orderSuccess.finalTotal}&addInfo=${orderSuccess.orderCode}&accountName=POKEMON TCG STORE`;
    return (
      <div className="container">
        <div className="success-container">
          <i className="fa-solid fa-circle-check success-icon"></i>
          <h2>Đặt hàng thành công!</h2>
          <p className="subtitle" style={{marginTop: '1rem'}}>Mã đơn hàng: <strong>{orderSuccess.orderCode}</strong></p>
          <p>Tổng thanh toán: <strong>{formatCurrency(orderSuccess.finalTotal)}</strong></p>
          <div className="qr-code"><img src={qrUrl} alt="VietQR" /></div>
          <button className="btn-primary" style={{marginTop: '2rem'}} onClick={() => setOrderSuccess(null)}>Quay lại</button>
        </div>
      </div>
    );
  }

  const renderProductGrid = (productList, title, icon, headerAction = null, id = null) => {
    if (!productList || productList.length === 0) return null;
    return (
      <div id={id} style={{marginBottom: '3rem'}}>
        {title && (
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', paddingBottom: '0.5rem', borderBottom: '2px solid rgba(255,255,255,0.05)', flexWrap: 'wrap', gap: '1rem'}}>
            <h2 style={{color: 'var(--text-primary)', margin: 0, display: 'flex', alignItems: 'center', gap: '1rem', fontSize: '1.5rem', fontWeight: '700'}}>{icon} <span>{title}</span></h2>
            {headerAction}
          </div>
        )}
        <div className="product-grid">
          {productList.map(product => {
            const qty = cart[product.id] || 0;
            return (
              <div key={product.id} className="product-card">
                <div style={{cursor: 'pointer'}} onClick={() => openProductDetail(product)}>
                  <div style={{position: 'relative'}}>
                    <img src={product.imageUrl || 'https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?q=80&w=600&auto=format&fit=crop'} alt={product.name} className="product-image"/>
                    <div style={{position: 'absolute', top: '10px', right: '10px', display: 'flex', gap: '0.5rem', flexWrap: 'wrap', justifyContent: 'flex-end', maxWidth: '150px'}}>
                      {product.isComingSoon && <div style={{background: 'rgba(168, 85, 247, 0.9)', color: '#fff', padding: '0.2rem 0.5rem', borderRadius: '4px', fontSize: '11px', fontWeight: 'bold'}}><i className="fa-solid fa-clock"></i> <span>Sắp ra mắt</span></div>}
                      {product.isFeatured && <div style={{background: 'rgba(251, 191, 36, 0.9)', color: '#000', padding: '0.2rem 0.5rem', borderRadius: '4px', fontSize: '11px', fontWeight: 'bold'}}><i className="fa-solid fa-star"></i> <span>Nổi bật</span></div>}
                      {product.isBestSeller && <div style={{background: 'rgba(239, 68, 68, 0.9)', color: '#fff', padding: '0.2rem 0.5rem', borderRadius: '4px', fontSize: '0.8rem', fontWeight: 'bold'}}><i className="fa-solid fa-fire"></i> Bán chạy</div>}
                    </div>
                  </div>
                  <h3 className="product-title">{product.name}</h3>
                  <p style={{color: 'var(--text-secondary)', fontSize: '11px', marginBottom: '1rem', flex: 1, display: '-webkit-box', WebkitLineClamp: 3, WebkitBoxOrient: 'vertical', overflow: 'hidden'}}>{product.description}</p>
                </div>
                <div className="product-price">{formatCurrency(product.price)}</div>
                <div className="product-stock">Kho: {product.stockQuantity}</div>
                <div className="quantity-controls">
                  {product.isComingSoon ? (
                    <span style={{color: '#a855f7', fontSize: '0.9rem', fontWeight: 'bold'}}><i className="fa-solid fa-clock"></i> Sắp ra mắt</span>
                  ) : (
                    <React.Fragment>
                      <button className="btn-icon" onClick={(e) => { e.stopPropagation(); handleQuantityChange(product.id, -1); }} disabled={qty === 0}><i className="fa-solid fa-minus"></i></button>
                      <span style={{fontWeight: '600', fontSize: '1.2rem'}}>{qty}</span>
                      <button className="btn-icon" onClick={(e) => { e.stopPropagation(); handleQuantityChange(product.id, 1); }} disabled={qty >= product.stockQuantity || product.stockQuantity === 0}><i className="fa-solid fa-plus"></i></button>
                    </React.Fragment>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  return (
    <div>
      <header className="store-header">
        <div className="store-header-inner">
          <a href="#" className="store-brand" style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}} onClick={(e) => { e.preventDefault(); setSelectedCategory(null); setSearchQuery(''); }}>
            <img src="/logo.png" alt="PikaRyu TCG Logo" style={{height: '60px', objectFit: 'contain'}} />
          </a>
          
          {categories.length > 0 && (
            <div className="category-filters" style={{marginBottom: 0, paddingBottom: 0, position: 'absolute', left: 'max(280px, calc((100vw - 1200px) / 2 + 2rem))', display: 'flex', alignItems: 'center', overflow: 'visible', gap: '0.5rem'}}>
              <button className={`category-filter-btn ${selectedCategory === null ? 'active' : ''}`} onClick={() => setSelectedCategory(null)}>Tất cả</button>
              
              <div className="header-dropdown" style={{position: 'relative'}}>
                <button className={`category-filter-btn ${selectedCategory !== null ? 'active' : ''}`} style={{display: 'flex', alignItems: 'center', gap: '0.5rem'}}>
                  {selectedCategory && categories.find(c => c.id === selectedCategory) ? categories.find(c => c.id === selectedCategory).name : 'Danh mục'} <i className="fa-solid fa-chevron-down"></i>
                </button>
                <div className="header-dropdown-content">
                  {categories.map(c => (
                    <div key={c.id} className={`dropdown-item ${selectedCategory === c.id ? 'active' : ''}`} onClick={() => setSelectedCategory(c.id)}>{c.name}</div>
                  ))}
                </div>
              </div>
            </div>
          )}
          <div style={{display: 'flex', alignItems: 'center', gap: '2rem', marginLeft: 'auto'}}>
            <div className="search-box" style={{minWidth: '250px'}}>
              <i className="fa-solid fa-search"></i>
              <input 
                type="text" 
                placeholder="Tìm kiếm thẻ bài..." 
                value={searchQuery} 
                onChange={(e) => setSearchQuery(e.target.value)} 
              />
            </div>
          <div style={{display: 'flex', gap: '0.5rem', flexShrink: 0, marginLeft: '1rem', alignItems: 'center'}}>
            <button className="btn-admin-login" onClick={toggleTheme} title="Đổi giao diện">
               <i className={`fa-solid ${theme === 'light' ? 'fa-moon' : 'fa-sun'}`}></i>
            </button>
            <button className="btn-admin-login" onClick={() => setShowCartModal(true)} title="Giỏ hàng" style={{position: 'relative'}}>
              <i className="fa-solid fa-cart-shopping" style={{color: 'var(--text-primary)'}}></i> <span className="hide-on-mobile">Giỏ hàng</span>
              {totalItems > 0 && <span style={{position: 'absolute', top: '-5px', right: '-5px', background: 'var(--accent-color)', color: '#fff', fontSize: '0.7rem', padding: '0.1rem 0.4rem', borderRadius: '10px', fontWeight: 'bold'}}>{totalItems}</span>}
            </button>
            <button className="btn-admin-login" onClick={() => setShowGradingModal(true)} title="Dịch vụ Chấm điểm PSA">
              <i className="fa-solid fa-star" style={{color: 'var(--badge-warning-text)'}}></i> <span className="hide-on-mobile">Chấm điểm PSA</span>
            </button>
            <button className="btn-admin-login" onClick={() => navigateTo('ADMIN_LOGIN')} title="Đăng nhập Quản trị viên">
              <i className="fa-solid fa-lock"></i> Quản trị
            </button>
          </div>
          </div>
        </div>
      </header>
      {banners.length > 0 && (
        <div className="store-banner" 
             style={{ cursor: banners[currentBannerIndex].linkUrl ? 'pointer' : 'default' }} 
             onClick={() => banners[currentBannerIndex].linkUrl && window.open(banners[currentBannerIndex].linkUrl, '_blank')}>
          <img src={banners[currentBannerIndex].imageUrl} alt={banners[currentBannerIndex].title || 'Banner'} />
          <div className="store-banner-overlay" style={{ background: (banners[currentBannerIndex].title || banners[currentBannerIndex].description) ? '' : 'none', pointerEvents: 'none' }}>
            {(banners[currentBannerIndex].title || banners[currentBannerIndex].description) && (
              <div className="store-banner-content" style={{ pointerEvents: 'none' }}>
                {banners[currentBannerIndex].title && <h2>{banners[currentBannerIndex].title}</h2>}
                {banners[currentBannerIndex].description && <p>{banners[currentBannerIndex].description}</p>}
              </div>
            )}
            {banners.length > 1 && (
              <div className="banner-carousel-controls" style={{ pointerEvents: 'auto' }}>
                {banners.map((b, idx) => (
                  <span key={b.id} className={`banner-dot ${idx === currentBannerIndex ? 'active' : ''}`} onClick={(e) => { e.stopPropagation(); setCurrentBannerIndex(idx); }}></span>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      <div className="container" style={{paddingTop: 0}}>

      {(!selectedCategory && !searchQuery) ? (
        <React.Fragment>
          {renderProductGrid(products.filter(p => p.isFeatured).sort((a,b) => (b.updatedAt ? new Date(b.updatedAt).getTime() : 0) - (a.updatedAt ? new Date(a.updatedAt).getTime() : 0)).slice(0, 6), "Sản phẩm Nổi bật", <i className="fa-solid fa-star" style={{color: 'var(--badge-warning-text)'}}></i>, null, "san-pham-noi-bat")}
          {renderProductGrid(products.filter(p => p.isBestSeller).sort((a,b) => (b.updatedAt ? new Date(b.updatedAt).getTime() : 0) - (a.updatedAt ? new Date(a.updatedAt).getTime() : 0)).slice(0, 6), "Bán chạy nhất", <i className="fa-solid fa-fire" style={{color: '#ef4444'}}></i>, null, "san-pham-ban-chay")}
          {renderProductGrid(products.filter(p => p.isComingSoon).sort((a,b) => (b.updatedAt ? new Date(b.updatedAt).getTime() : 0) - (a.updatedAt ? new Date(a.updatedAt).getTime() : 0)).slice(0, 6), "Sắp ra mắt", <i className="fa-solid fa-clock" style={{color: '#a855f7'}}></i>, null, "san-pham-sap-ra-mat")}
          {(() => {
            const allProducts = applySort(products);
            const totalPages = Math.ceil(allProducts.length / itemsPerPage);
            const paginated = allProducts.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
            return (
              <React.Fragment>
                {renderProductGrid(paginated, "Tất cả sản phẩm", <i className="fa-solid fa-boxes-stacked" style={{color: '#3b82f6'}}></i>, sortControl)}
                {totalPages > 1 && (
                  <div style={{display: 'flex', justifyContent: 'center', gap: '0.5rem', marginBottom: '3rem', marginTop: '-1.5rem', flexWrap: 'wrap'}}>
                    {Array.from({length: totalPages}, (_, i) => i + 1).map(p => (
                      <button key={p} className="btn-icon" style={p === currentPage ? {background: 'var(--accent-color)', color: '#fff', width: '40px', height: '40px', borderRadius: '50%'} : {background: 'var(--glass-bg)', color: 'var(--text-primary)', width: '40px', height: '40px', borderRadius: '50%', border: '1px solid var(--glass-border)'}} onClick={() => setCurrentPage(p)}>{p}</button>
                    ))}
                  </div>
                )}
              </React.Fragment>
            );
          })()}
        </React.Fragment>
      ) : (
        <React.Fragment>
          {filteredProducts.length === 0 ? (
            <p style={{textAlign: 'center', color: 'var(--text-secondary)', padding: '2rem'}}>Không tìm thấy sản phẩm nào phù hợp.</p>
          ) : (
            (() => {
              const allFiltered = applySort(filteredProducts);
              const totalPages = Math.ceil(allFiltered.length / itemsPerPage);
              const paginated = allFiltered.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);
              return (
                <React.Fragment>
                  {renderProductGrid(paginated, "Kết quả tìm kiếm", <i className="fa-solid fa-search" style={{color: 'var(--primary)'}}></i>, sortControl)}
                  {totalPages > 1 && (
                    <div style={{display: 'flex', justifyContent: 'center', gap: '0.5rem', marginBottom: '3rem', marginTop: '-1.5rem', flexWrap: 'wrap'}}>
                      {Array.from({length: totalPages}, (_, i) => i + 1).map(p => (
                        <button key={p} className="btn-icon" style={p === currentPage ? {background: 'var(--accent-color)', color: '#fff', width: '40px', height: '40px', borderRadius: '50%'} : {background: 'var(--glass-bg)', color: 'var(--text-primary)', width: '40px', height: '40px', borderRadius: '50%', border: '1px solid var(--glass-border)'}} onClick={() => setCurrentPage(p)}>{p}</button>
                      ))}
                    </div>
                  )}
                </React.Fragment>
              );
            })()
          )}
        </React.Fragment>
      )}

      {totalItems > 0 && (
        <div className="floating-bar">
          <div className="floating-total">Tổng cộng ({totalItems} sp):<br/><span>{formatCurrency(totalPrice)}</span></div>
          <div style={{display: 'flex', gap: '0.5rem'}}>
            <button className="btn-icon" onClick={toggleTheme} title="Đổi giao diện" style={{width: '40px', height: '40px', borderRadius: '50%', background: 'var(--card-bg)', border: '1px solid var(--glass-border)', color: 'var(--text-primary)'}}>
              <i className={`fa-solid ${theme === 'light' ? 'fa-moon' : 'fa-sun'}`}></i>
            </button>
            <button className="btn-icon" style={{position: 'relative', width: '40px', height: '40px', borderRadius: '50%', background: 'var(--card-bg)', border: '1px solid var(--glass-border)', color: 'var(--text-primary)'}} onClick={() => setShowCartModal(true)} title="Xem giỏ hàng"><i className="fa-solid fa-cart-shopping"></i></button>
            <button className="btn-primary" onClick={() => setShowCheckout(true)}>Thanh toán ngay <i className="fa-solid fa-arrow-right"></i></button>
          </div>
        </div>
      )}

      {showCartModal && (
        <div className="modal-overlay">
          <div className="modal-content" style={{maxWidth: '600px'}}>
            <h2 className="modal-title"><i className="fa-solid fa-cart-shopping"></i> Giỏ hàng của bạn</h2>
            {totalItems === 0 ? (
              <div style={{textAlign: 'center', padding: '3rem 1rem', color: 'var(--text-secondary)'}}>
                <i className="fa-solid fa-cart-arrow-down" style={{fontSize: '3rem', marginBottom: '1rem', opacity: 0.5}}></i>
                <p>Giỏ hàng của bạn đang trống.</p>
              </div>
            ) : (
              <div className="cart-items" style={{maxHeight: '60vh', overflowY: 'auto', paddingRight: '0.5rem'}}>
                {Object.entries(cart).filter(([_, qty]) => qty > 0).map(([productId, qty]) => {
                  const product = products.find(p => p.id === parseInt(productId));
                  if (!product) return null;
                  return (

};

const AdminLogin = ({ navigateTo, onLoginSuccess }) => {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [successMsg, setSuccessMsg] = useState('');

  // 0: login, 1: request OTP, 2: reset password
  const [forgotStep, setForgotStep] = useState(0);
  const [otp, setOtp] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [loading, setLoading] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError('');
    setSuccessMsg('');
    try {
      const res = await axios.post(`${API_BASE_URL}/admin/login`, { username, password });
      onLoginSuccess(res.data.token);
    } catch (err) {
      setError((err.response && err.response.data && err.response.data.message) || 'Sai tài khoản hoặc mật khẩu');
    }
  };

  const handleForgotPassword = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError('');
    setSuccessMsg('');
    try {
      const res = await axios.post(`${API_BASE_URL}/admin/public/forgot-password`, { username });
      setSuccessMsg(res.data.message);
      setForgotStep(2);
    } catch (err) {
      setError((err.response && err.response.data && err.response.data.message) || 'Có lỗi xảy ra');
    } finally {
      setLoading(false);
    }
  };

  const handleResetPassword = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError('');
    setSuccessMsg('');
    try {
      const res = await axios.post(`${API_BASE_URL}/admin/public/reset-password`, { username, otp, newPassword });
      setSuccessMsg(res.data.message);
      setForgotStep(0);
      setOtp('');
      setNewPassword('');
      setPassword('');
    } catch (err) {
      setError((err.response && err.response.data && err.response.data.message) || 'Có lỗi xảy ra');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="container login-container">
      <div className="admin-nav">
        <button className="btn-secondary" onClick={() => navigateTo('STOREFRONT')}><i className="fa-solid fa-arrow-left"></i> Về cửa hàng</button>
      </div>
      <div className="login-box" style={{position: 'relative'}}>
        {loading && <div className="loading-spinner"><div className="spinner"></div></div>}
        
        {forgotStep === 0 && (
          <div>
            <h2>Đăng nhập Quản trị</h2>
            {successMsg && <p className="success-text" style={{marginBottom: '1rem', color: '#10b981'}}>{successMsg}</p>}
            <form onSubmit={handleLogin}>
              <div className="input-group" style={{textAlign: 'left'}}>
                <label>Tài khoản</label>
                <input type="text" value={username} onChange={e => setUsername(e.target.value)} required />
              </div>
              <div className="input-group" style={{textAlign: 'left'}}>
                <label>Mật khẩu</label>
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} required />
              </div>
              <div style={{textAlign: 'right', marginBottom: '1rem'}}>
                <a href="#" onClick={(e) => { e.preventDefault(); setForgotStep(1); setError(''); setSuccessMsg(''); }} style={{color: 'var(--accent-color)', fontSize: '0.9rem', textDecoration: 'none'}}>Quên mật khẩu?</a>
              </div>
              {error && <p className="error-text" style={{marginBottom: '1rem'}}>{error}</p>}
              <button type="submit" className="btn-primary" style={{width: '100%'}}>Đăng nhập</button>
            </form>
          </div>
        )}

        {forgotStep === 1 && (
          <div>
            <h2>Khôi phục mật khẩu</h2>
            <p style={{marginBottom: '1rem', color: 'var(--text-secondary)', fontSize: '0.9rem'}}>Nhập tài khoản quản trị để nhận mã xác nhận qua email.</p>
            <form onSubmit={handleForgotPassword}>
              <div className="input-group" style={{textAlign: 'left'}}>
                <label>Tài khoản</label>
                <input type="text" value={username} onChange={e => setUsername(e.target.value)} required />
              </div>
              {error && <p className="error-text" style={{marginBottom: '1rem'}}>{error}</p>}
              <button type="submit" className="btn-primary" style={{width: '100%', marginBottom: '1rem'}} disabled={loading}>Gửi mã xác nhận</button>
              <button type="button" className="btn-secondary" style={{width: '100%'}} onClick={() => { setForgotStep(0); setError(''); setSuccessMsg(''); }} disabled={loading}>Hủy</button>
            </form>
          </div>
        )}

        {forgotStep === 2 && (
          <div>
            <h2>Tạo mật khẩu mới</h2>
            {successMsg && <p className="success-text" style={{marginBottom: '1rem', color: '#10b981'}}>{successMsg}</p>}
            <p style={{marginBottom: '1rem', color: 'var(--text-secondary)', fontSize: '0.9rem'}}>Kiểm tra hộp thư đến của bạn để lấy mã OTP.</p>
            <form onSubmit={handleResetPassword}>
              <div className="input-group" style={{textAlign: 'left'}}>
                <label>Mã OTP (6 số)</label>
                <input type="text" value={otp} onChange={e => setOtp(e.target.value)} required maxLength={6} />
              </div>
              <div className="input-group" style={{textAlign: 'left'}}>
                <label>Mật khẩu mới</label>
                <input type="password" value={newPassword} onChange={e => setNewPassword(e.target.value)} required minLength={6} />
              </div>
              {error && <p className="error-text" style={{marginBottom: '1rem'}}>{error}</p>}
              <button type="submit" className="btn-primary" style={{width: '100%', marginBottom: '1rem'}} disabled={loading}>Đổi mật khẩu</button>
              <button type="button" className="btn-secondary" style={{width: '100%'}} onClick={() => { setForgotStep(0); setError(''); setSuccessMsg(''); }} disabled={loading}>Hủy</button>
            </form>
          </div>
        )}
      </div>
    </div>
  );
};

  const [adminProductCategoryFilter, setAdminProductCategoryFilter] = useState('');

  const [categoryFormData, setCategoryFormData] = useState({ name: '', description: '' });
  const [adminCategorySearchQuery, setAdminCategorySearchQuery] = useState('');
  const [adminBannerSearchQuery, setAdminBannerSearchQuery] = useState('');

  // Subscriber & Notification States
  const [subscribers, setSubscribers] = useState([]);
  const [notifSubject, setNotifSubject] = useState('');
  const [notifContent, setNotifContent] = useState('');
  const [sendingNotif, setSendingNotif] = useState(false);
  const [notifResult, setNotifResult] = useState(null);

  // Banner States
  const [banners, setBanners] = useState([]);
  const [showBannerModal, setShowBannerModal] = useState(false);
  const [editingBannerId, setEditingBannerId] = useState(null);
  const [bannerFormData, setBannerFormData] = useState({ title: '', description: '', imageUrl: '', linkUrl: '', isActive: true });

  // Settings States
  const [gradingPolicyForm, setGradingPolicyForm] = useState({intro: '', steps: [], phone: '', facebook: '', address: ''});
  const [savingSettings, setSavingSettings] = useState(false);

  // Data Fetching
  const fetchProducts = async () => {
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/products`, { headers: { Authorization: token } });
      setProducts(res.data);
    } catch (err) { if (err.response && err.response.status === 401) onLogout(); }
  };

  const fetchCategories = async () => {
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/categories`, { headers: { Authorization: token } });
      setCategories(res.data);
    } catch (err) { console.error(err); }
  };

  const fetchBanners = async () => {
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/banners`, { headers: { Authorization: token } });
      setBanners(res.data);
    } catch (err) { console.error(err); }
  };

  const fetchSubscribers = async () => {
    try {
      const res = await axios.get(`${API_BASE_URL}/admin/subscribers`, { headers: { Authorization: token } });
      setSubscribers(res.data);
    } catch (err) { console.error(err); }
  };

  const fetchSettings = async () => {
    try {
      const res = await axios.get(`${API_BASE_URL}/public/settings/gradingPolicy`);
      if (res.data && res.data.value) setGradingPolicyForm(JSON.parse(res.data.value));
    } catch (err) { console.error(err); }
  };

  useEffect(() => { 
    fetchProducts(); 
    fetchCategories();
    fetchBanners();
    fetchSubscribers();
    fetchSettings();
  }, []);

  // --- Banner Handlers ---
  const handleBannerDelete = async (id) => {
    if (!confirm('Bạn có chắc muốn xóa banner này?')) return;
    try {
      await axios.delete(`${API_BASE_URL}/admin/banners/${id}`, { headers: { Authorization: token } });
      fetchBanners();
    } catch (err) { alert('Lỗi khi xóa banner!'); }
  };

  // --- Settings Handlers ---
  const handleSaveSettings = async (e) => {
    e.preventDefault();
    setSavingSettings(true);
    try {
      await axios.put(`${API_BASE_URL}/admin/settings/gradingPolicy`, { value: JSON.stringify(gradingPolicyForm) }, { headers: { Authorization: token } });
      alert('Đã lưu cấu hình thành công!');
    } catch (err) {
      alert('Lỗi khi lưu cấu hình!');
    } finally {
      setSavingSettings(false);
    }
  };

  const openBannerModal = (banner = null) => {
    if (banner) {
      setEditingBannerId(banner.id);
      setBannerFormData({ 
        title: banner.title, 
        description: banner.description || '', 
        imageUrl: banner.imageUrl || '', 
        linkUrl: banner.linkUrl || '', 
        isActive: banner.isActive 
      });
    } else {
      setEditingBannerId(null);
      setBannerFormData({ title: '', description: '', imageUrl: '', linkUrl: '', isActive: true });
    }
    setShowBannerModal(true);
  };

  const handleBannerImageUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const uploadData = new FormData();
    uploadData.append('file', file);
    try {
      const res = await axios.post(`${API_BASE_URL}/admin/upload`, uploadData, { headers: { Authorization: token, 'Content-Type': 'multipart/form-data' } });
      setBannerFormData({...bannerFormData, imageUrl: res.data.imageUrl});
    } catch (err) { alert('Lỗi khi tải ảnh lên!'); }

  const handleSaveBanner = async (e) => {
    e.preventDefault();
    try {
      if (editingBannerId) {
        await axios.put(`${API_BASE_URL}/admin/banners/${editingBannerId}`, bannerFormData, { headers: { Authorization: token } });

      setShowBannerModal(false);
      fetchBanners();

      await axios.delete(`${API_BASE_URL}/admin/categories/${id}`, { headers: { Authorization: token } });

    } catch (err) { alert('Lỗi khi xóa danh mục! Có thể do còn sản phẩm thuộc danh mục này.'); }
  };

  const openCategoryModal = (cat = null) => {

      setEditingCategoryId(cat.id);

      setCategoryFormData({ name: '', description: '' });

  };

  const handleSaveCategory = async (e) => {
    e.preventDefault();
    try {

        await axios.put(`${API_BASE_URL}/admin/categories/${editingCategoryId}`, categoryFormData, { headers: { Authorization: token } });

        await axios.post(`${API_BASE_URL}/admin/categories`, categoryFormData, { headers: { Authorization: token } });
      }
      setShowCategoryModal(false);
      fetchCategories();
    } catch (err) { alert('Lỗi khi lưu danh mục!'); }
  };

  // --- Product Handlers ---
  const toggleProductFeature = async (product, featureField) => {
    try {
      const updatedData = {
        name: product.name, description: product.description || '', detailedDescription: product.detailedDescription || '', price: product.price, 
        stockQuantity: product.stockQuantity, imageUrl: product.imageUrl || '', additionalImages: product.additionalImages || [], isDeleted: product.isDeleted,
        isFeatured: featureField === 'isFeatured' ? !product.isFeatured : (product.isFeatured || false),
        isBestSeller: featureField === 'isBestSeller' ? !product.isBestSeller : (product.isBestSeller || false),
        isComingSoon: featureField === 'isComingSoon' ? !product.isComingSoon : (product.isComingSoon || false),
        category: product.category ? { id: product.category.id } : null
      };
      await axios.put(`${API_BASE_URL}/admin/products/${product.id}`, updatedData, { headers: { Authorization: token } });
      fetchProducts();
    } catch (err) { alert('Lỗi khi cập nhật sản phẩm!'); }
  };

  const handleProductDelete = async (id) => {
    if (!confirm('Bạn có chắc muốn xóa/ẩn sản phẩm này?')) return;
    try {
      await axios.delete(`${API_BASE_URL}/admin/products/${id}`, { headers: { Authorization: token } });
      fetchProducts();
    } catch (err) { alert('Lỗi khi xóa!'); }
  };

  const openProductModal = (product = null) => {
    if (product) {
      setEditingProductId(product.id);
      setProductFormData({ 
        name: product.name, description: product.description || '', detailedDescription: product.detailedDescription || '', price: product.price, 
        stockQuantity: product.stockQuantity, imageUrl: product.imageUrl || '', additionalImages: product.additionalImages || [], isDeleted: product.isDeleted,
        isFeatured: product.isFeatured || false, isBestSeller: product.isBestSeller || false, isComingSoon: product.isComingSoon || false,
        category: product.category ? { id: product.category.id } : null
      });
    } else {
      setEditingProductId(null);
      setProductFormData({ name: '', description: '', detailedDescription: '', price: '', stockQuantity: '', imageUrl: '', additionalImages: [], isDeleted: false, isFeatured: false, isBestSeller: false, isComingSoon: false, category: null });
    }
    setShowProductModal(true);
  };

  const handleImageUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const uploadData = new FormData();
    uploadData.append('file', file);
    try {
      const res = await axios.post(`${API_BASE_URL}/admin/upload`, uploadData, { headers: { Authorization: token, 'Content-Type': 'multipart/form-data' } });
      setProductFormData({...productFormData, imageUrl: res.data.imageUrl});
    } catch (err) { alert('Lỗi khi tải ảnh lên!'); }
  };

  const handleAdditionalImageUpload = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const uploadData = new FormData();
    uploadData.append('file', file);
    try {
      const res = await axios.post(`${API_BASE_URL}/admin/upload`, uploadData, { headers: { Authorization: token, 'Content-Type': 'multipart/form-data' } });
      const currentImages = productFormData.additionalImages || [];
      setProductFormData({...productFormData, additionalImages: [...currentImages, res.data.imageUrl]});
    } catch (err) { alert('Lỗi khi tải ảnh lên!'); }
  };

  const removeAdditionalImage = (index) => {
    const newImages = [...productFormData.additionalImages];
    newImages.splice(index, 1);
    setProductFormData({...productFormData, additionalImages: newImages});
  };

  const handleSaveProduct = async (e) => {
    e.preventDefault();
    try {
      if (editingProductId) {
        await axios.put(`${API_BASE_URL}/admin/products/${editingProductId}`, productFormData, { headers: { Authorization: token } });
      } else {
        await axios.post(`${API_BASE_URL}/admin/products`, productFormData, { headers: { Authorization: token } });
      }
      setShowProductModal(false);
      fetchProducts();
    } catch (err) { alert('Lỗi khi lưu sản phẩm!'); }
  };

  const filteredAdminProducts = products.filter(p => {
    const matchCategory = adminProductCategoryFilter ? (p.category && p.category.id.toString() === adminProductCategoryFilter) : true;
    const matchSearch = p.name.toLowerCase().includes(adminProductSearchQuery.toLowerCase());
    return matchCategory && matchSearch;
  });

  return (
    <div className="container" style={{maxWidth: '1400px'}}>
      <div className="admin-header">
        <h2><i className="fa-solid fa-shield-halved"></i> Admin Dashboard</h2>
        <div style={{display: 'flex', gap: '1rem'}}>
          <button className="btn-secondary" onClick={() => navigateTo('STOREFRONT')}>Về cửa hàng</button>
          <button className="btn-danger btn-small" onClick={onLogout}>Đăng xuất</button>
        </div>
      </div>

      <div className="tabs">
        <button className={`tab ${activeTab === 'products' ? 'active' : ''}`} onClick={() => setActiveTab('products')}>Quản lý Sản phẩm</button>
        <button className={`tab ${activeTab === 'categories' ? 'active' : ''}`} onClick={() => setActiveTab('categories')}>Quản lý Danh mục</button>
        <button className={`tab ${activeTab === 'banners' ? 'active' : ''}`} onClick={() => setActiveTab('banners')}>Quản lý Banner</button>
        <button className={`tab ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => { setActiveTab('settings'); fetchSettings(); }}>Cấu hình Hệ thống</button>
        <button className={`tab ${activeTab === 'notifications' ? 'active' : ''}`} onClick={() => { setActiveTab('notifications'); fetchSubscribers(); }}><i className="fa-solid fa-bell" style={{marginRight: '0.3rem'}}></i>Thông báo</button>
      </div>

      {activeTab === 'products' && (
        <div>
          <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', alignItems: 'center', flexWrap: 'wrap', gap: '1rem'}}>
            <h3>Danh sách Sản phẩm</h3>
            <div style={{display: 'flex', gap: '1rem', flex: 1, justifyContent: 'flex-end', alignItems: 'center'}}>
              <div className="search-box" style={{marginBottom: 0}}>
                <i className="fa-solid fa-search"></i>
                <input 
                  type="text" 
                  placeholder="Tìm kiếm sản phẩm..." 
                  value={adminProductSearchQuery} 
                  onChange={(e) => setAdminProductSearchQuery(e.target.value)} 
                />
              </div>
              <select 
                value={adminProductCategoryFilter} 
                onChange={(e) => setAdminProductCategoryFilter(e.target.value)}
                style={{padding: '0.8rem 1rem', borderRadius: '30px', border: '1px solid var(--glass-border)', background: 'var(--card-bg)', color: 'var(--text-primary)', outline: 'none'}}
              >
                <option value="">Tất cả danh mục</option>
                {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <button className="btn-primary" onClick={() => openProductModal()}><i className="fa-solid fa-plus"></i> Thêm Sản phẩm</button>
            </div>
          </div>
          <div className="admin-table-container">
            <table className="admin-table">
              <thead>
                <tr>
                  <th>ID</th><th>Ảnh</th><th>Tên sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Hành động</th>
                </tr>
              </thead>
              <tbody>
                {filteredAdminProducts.map(p => (
                  <tr key={p.id}>
                    <td>{p.id}</td>
                    <td><img src={p.imageUrl || 'https://via.placeholder.com/50'} alt={p.name} /></td>
                    <td><strong>{p.name}</strong><br/><small style={{color: 'var(--text-secondary)'}}>{p.description}</small></td>
                    <td>{p.category ? <span className="category-tag">{p.category.name}</span> : <em style={{color: '#94a3b8'}}>(Chưa phân loại)</em>}</td>
                    <td style={{color: 'var(--accent-color)', fontWeight: 'bold'}}>{formatCurrency(p.price)}</td>
                    <td>{p.stockQuantity}</td>
                    <td>{p.isDeleted ? <span style={{background: 'var(--badge-danger-bg)', color: 'var(--badge-danger-text)', padding: '4px 8px', borderRadius: '4px', fontSize: '0.8rem'}}>Đã ẩn</span> : <span style={{background: 'var(--badge-success-bg)', color: 'var(--badge-success-text)', padding: '4px 8px', borderRadius: '4px', fontSize: '0.8rem'}}>Đang bán</span>}</td>
                    <td>
                      <div className="admin-actions">
                        <button className={`btn-small ${p.isFeatured ? 'btn-primary' : 'btn-secondary'}`} style={{padding: '0.4rem 0.6rem'}} onClick={() => toggleProductFeature(p, 'isFeatured')} title={p.isFeatured ? "Hủy Nổi bật" : "Đánh dấu Nổi bật"}><i className="fa-solid fa-star" style={{color: p.isFeatured ? '#d97706' : 'inherit'}}></i></button>
                        <button className={`btn-small ${p.isBestSeller ? 'btn-danger' : 'btn-secondary'}`} style={{padding: '0.4rem 0.6rem'}} onClick={() => toggleProductFeature(p, 'isBestSeller')} title={p.isBestSeller ? "Hủy Bán chạy" : "Đánh dấu Bán chạy"}><i className="fa-solid fa-fire" style={{color: p.isBestSeller ? '#fff' : 'inherit'}}></i></button>
                        <button className={`btn-small ${p.isComingSoon ? 'btn-primary' : 'btn-secondary'}`} style={{padding: '0.4rem 0.6rem', background: p.isComingSoon ? 'rgba(168, 85, 247, 0.2)' : ''}} onClick={() => toggleProductFeature(p, 'isComingSoon')} title={p.isComingSoon ? "Hủy Sắp ra mắt" : "Đánh dấu Sắp ra mắt"}><i className="fa-solid fa-clock" style={{color: p.isComingSoon ? '#a855f7' : 'inherit'}}></i></button>
                        <button className="btn-secondary btn-small" onClick={() => openProductModal(p)} style={{padding: '0.4rem 0.8rem', fontSize: '0.875rem'}} title="Sửa"><i className="fa-solid fa-pen"></i></button>
                        {!p.isDeleted && <button className="btn-danger btn-small" onClick={() => handleProductDelete(p.id)} title="Xóa/Ẩn"><i className="fa-solid fa-trash"></i></button>}
                      </div>
                    </td>
                  </tr>
                ))}
                {filteredAdminProducts.length === 0 && <tr><td colSpan="8" style={{textAlign: 'center'}}>Chưa có dữ liệu</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {activeTab === 'categories' && (
        <div>
          <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', alignItems: 'center', flexWrap: 'wrap', gap: '1rem'}}>
            <h3>Danh sách Danh mục</h3>
            <div style={{display: 'flex', gap: '1rem', flex: 1, justifyContent: 'flex-end', alignItems: 'center'}}>
              <div className="search-box" style={{marginBottom: 0}}>
                <i className="fa-solid fa-search"></i>
                <input 
                  type="text" 
                  placeholder="Tìm kiếm danh mục..." 
                  value={adminCategorySearchQuery} 
                  onChange={(e) => setAdminCategorySearchQuery(e.target.value)} 
                />
              </div>
              <button className="btn-primary" onClick={() => openCategoryModal()}><i className="fa-solid fa-plus"></i> Thêm Danh mục</button>
            </div>
          </div>
          <div className="admin-table-container">
            <table className="admin-table">
              <thead><tr><th>ID</th><th>Tên Danh mục</th><th>Mô tả</th><th>Hành động</th></tr></thead>
              <tbody>
                {categories.filter(c => c.name.toLowerCase().includes(adminCategorySearchQuery.toLowerCase()) || (c.description && c.description.toLowerCase().includes(adminCategorySearchQuery.toLowerCase()))).map(c => (
                  <tr key={c.id}>
                    <td>{c.id}</td>
                    <td><strong>{c.name}</strong></td>
                    <td>{c.description}</td>
                    <td>
                      <div className="admin-actions">
                        <button className="btn-secondary btn-small" onClick={() => openCategoryModal(c)} style={{padding: '0.4rem 0.8rem'}}><i className="fa-solid fa-pen"></i></button>
                        <button className="btn-danger btn-small" onClick={() => handleCategoryDelete(c.id)}><i className="fa-solid fa-trash"></i></button>
                      </div>
                    </td>
                  </tr>
                ))}
                {categories.length === 0 && <tr><td colSpan="4" style={{textAlign: 'center'}}>Chưa có dữ liệu</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {activeTab === 'notifications' && (
        <div>
          {/* Compose notification */}
          <div style={{background: 'rgba(102,126,234,0.08)', border: '1px solid rgba(102,126,234,0.2)', borderRadius: '12px', padding: '1.5rem', marginBottom: '2rem'}}>
            <h3 style={{marginBottom: '1rem'}}><i className="fa-solid fa-paper-plane" style={{marginRight: '0.5rem', color: 'var(--accent-color)'}}></i>Gửi thông báo đến tất cả Subscriber</h3>
            <div className="input-group">
              <label>Tiêu đề email *</label>
              <input type="text" placeholder="VD: Hàng mới về - Scarlet & Violet 151" value={notifSubject} onChange={e => setNotifSubject(e.target.value)} />
            </div>
            <div className="input-group">
              <label>Nội dung thông báo *</label>
              <textarea rows="5" placeholder="Nhập nội dung thông báo gửi đến khách hàng..." value={notifContent} onChange={e => setNotifContent(e.target.value)} style={{width: '100%', padding: '0.75rem', background: 'var(--card-bg)', border: '1px solid var(--border-color)', borderRadius: '8px', color: 'var(--text-primary)', resize: 'vertical', fontFamily: 'inherit', fontSize: '0.95rem'}}></textarea>
            </div>
            <div style={{display: 'flex', alignItems: 'center', gap: '1rem', flexWrap: 'wrap'}}>
              <button className="btn-primary" disabled={sendingNotif || !notifSubject.trim() || !notifContent.trim()} onClick={async () => {
                setSendingNotif(true); setNotifResult(null);
                try {
                  const res = await axios.post(`${API_BASE_URL}/admin/notifications/send`, { subject: notifSubject, content: notifContent }, { headers: { Authorization: token } });
                  setNotifResult({ type: 'success', message: `${res.data.message} (${res.data.sentCount} email đã gửi)` });
                  setNotifSubject(''); setNotifContent('');
                } catch (err) {
                  setNotifResult({ type: 'error', message: (err.response && err.response.data && err.response.data.message) || 'Lỗi khi gửi thông báo!' });
                } finally { setSendingNotif(false); }
              }}>
                {sendingNotif ? <span><i className="fa-solid fa-spinner fa-spin"></i> Đang gửi...</span> : <span><i className="fa-solid fa-paper-plane"></i> Gửi thông báo</span>}
              </button>
              <span style={{color: '#94a3b8', fontSize: '0.85rem'}}>
                <i className="fa-solid fa-circle-info"></i> Chỉ gửi đến {subscribers.filter(s => s.verified).length} email đã xác nhận
              </span>
            </div>
            {notifResult && (
              <div style={{marginTop: '1rem', padding: '0.75rem 1rem', borderRadius: '8px', background: notifResult.type === 'success' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)', color: notifResult.type === 'success' ? '#059669' : '#dc2626', fontSize: '0.9rem'}}>
                <i className={`fa-solid ${notifResult.type === 'success' ? 'fa-circle-check' : 'fa-circle-xmark'}`} style={{marginRight: '0.5rem'}}></i>
                {notifResult.message}
              </div>
            )}
          </div>

          {/* Subscriber list */}
          <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', alignItems: 'center'}}>
            <h3>Danh sách Email đăng ký ({subscribers.length})</h3>
            <button className="btn-secondary" onClick={fetchSubscribers}><i className="fa-solid fa-arrows-rotate"></i> Làm mới</button>
          </div>
          <div className="admin-table-container">
            <table className="admin-table">
              <thead><tr><th>ID</th><th>Email</th><th>Trạng thái</th><th>Ngày đăng ký</th><th>Hành động</th></tr></thead>
              <tbody>
                {subscribers.map(s => (
                  <tr key={s.id}>
                    <td>{s.id}</td>
                    <td><strong>{s.email}</strong></td>
                    <td>
                      {s.verified
                        ? <span style={{background: 'rgba(16,185,129,0.2)', color: '#059669', padding: '4px 10px', borderRadius: '4px', fontSize: '0.8rem'}}><i className="fa-solid fa-circle-check" style={{marginRight: '4px'}}></i>Đã xác nhận</span>
                        : <span style={{background: 'rgba(251,191,36,0.2)', color: 'var(--badge-warning-text)', padding: '4px 10px', borderRadius: '4px', fontSize: '0.8rem'}}><i className="fa-solid fa-clock" style={{marginRight: '4px'}}></i>Chờ xác nhận</span>
                      }
                    </td>
                    <td style={{color: '#94a3b8', fontSize: '0.85rem'}}>{s.subscribedAt ? new Date(s.subscribedAt).toLocaleString('vi-VN') : '—'}</td>
                    <td>
                      <button className="btn-danger btn-small" onClick={async () => {
                        if (!confirm(`Xóa subscriber ${s.email}?`)) return;
                        try {
                          await axios.delete(`${API_BASE_URL}/admin/subscribers/${s.id}`, { headers: { Authorization: token } });
                          fetchSubscribers();
                        } catch (err) { alert('Lỗi khi xóa!'); }
                      }}><i className="fa-solid fa-trash"></i></button>
                    </td>
                  </tr>
                ))}
                {subscribers.length === 0 && <tr><td colSpan="5" style={{textAlign: 'center'}}>Chưa có ai đăng ký</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {activeTab === 'banners' && (
        <div>
          <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', alignItems: 'center', flexWrap: 'wrap', gap: '1rem'}}>
            <h3>Quản lý Banner Quảng Cáo</h3>
            <div style={{display: 'flex', gap: '1rem', flex: 1, justifyContent: 'flex-end', alignItems: 'center'}}>
              <div className="search-box" style={{marginBottom: 0}}>
                <i className="fa-solid fa-search"></i>
                <input 
                  type="text" 
                  placeholder="Tìm kiếm banner..." 
                  value={adminBannerSearchQuery} 
                  onChange={(e) => setAdminBannerSearchQuery(e.target.value)} 
                />
              </div>
              <button className="btn-primary" onClick={() => openBannerModal()}><i className="fa-solid fa-plus"></i> Thêm Banner</button>
            </div>
          </div>
          <div className="admin-table-container">
            <table className="admin-table">
              <thead><tr><th>ID</th><th>Ảnh</th><th>Tiêu đề</th><th>Link đích</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
              <tbody>
                {banners.filter(b => b.title.toLowerCase().includes(adminBannerSearchQuery.toLowerCase()) || (b.description && b.description.toLowerCase().includes(adminBannerSearchQuery.toLowerCase()))).map(b => (
                  <tr key={b.id}>
                    <td>{b.id}</td>
                    <td><img src={b.imageUrl || 'https://via.placeholder.com/100x50'} alt={b.title} style={{width: '100px', height: '50px', objectFit: 'cover'}} /></td>
                    <td><strong>{b.title}</strong><br/><small style={{color: 'var(--text-secondary)'}}>{b.description}</small></td>
                    <td>{b.linkUrl ? <a href={b.linkUrl} target="_blank" rel="noopener noreferrer" style={{color: 'var(--accent-color)'}}><i className="fa-solid fa-link"></i> Xem link</a> : <em style={{color: '#94a3b8'}}>Không có</em>}</td>
                    <td>{b.isActive ? <span style={{background: 'var(--badge-success-bg)', color: 'var(--badge-success-text)', padding: '4px 8px', borderRadius: '4px', fontSize: '0.8rem'}}>Đang hiển thị</span> : <span style={{background: 'var(--badge-danger-bg)', color: 'var(--badge-danger-text)', padding: '4px 8px', borderRadius: '4px', fontSize: '0.8rem'}}>Đã ẩn</span>}</td>
                    <td>
                      <div className="admin-actions">
                        <button className="btn-secondary btn-small" onClick={() => openBannerModal(b)} style={{padding: '0.4rem 0.8rem'}}><i className="fa-solid fa-pen"></i></button>
                        <button className="btn-danger btn-small" onClick={() => handleBannerDelete(b.id)}><i className="fa-solid fa-trash"></i></button>
                      </div>
                    </td>
                  </tr>
                ))}
                {banners.length === 0 && <tr><td colSpan="6" style={{textAlign: 'center'}}>Chưa có banner nào</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {activeTab === 'settings' && (
        <div style={{maxWidth: '800px', margin: '0 auto'}}>
          <div style={{display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', alignItems: 'center'}}>
            <h3>Cấu hình Hệ thống (Chính sách Đánh giá)</h3>
          </div>
          <form onSubmit={handleSaveSettings} style={{background: 'var(--card-bg)', padding: '2rem', borderRadius: '12px', border: '1px solid var(--glass-border)'}}>
            <div className="input-group">
              <label>Lời giới thiệu</label>
              <textarea 
                value={gradingPolicyForm.intro} 
                onChange={e => setGradingPolicyForm({...gradingPolicyForm, intro: e.target.value})} 
                rows="3" required 
              />
            </div>
            
            <div className="input-group">
              <label style={{display: 'flex', justifyContent: 'space-between'}}>
                <span>Các bước quy trình</span>
                <button type="button" className="btn-secondary btn-small" onClick={() => setGradingPolicyForm({...gradingPolicyForm, steps: [...gradingPolicyForm.steps, '']})}>
                  <i className="fa-solid fa-plus"></i> Thêm bước
                </button>
              </label>
              {gradingPolicyForm.steps.map((step, idx) => (
                <div key={idx} style={{display: 'flex', gap: '0.5rem', marginBottom: '0.5rem'}}>
                  <span style={{padding: '0.8rem', background: 'rgba(255,255,255,0.05)', borderRadius: '8px'}}>{idx + 1}.</span>
                  <input 
                    type="text" 
                    value={step} 
                    onChange={e => {
                      const newSteps = [...gradingPolicyForm.steps];
                      newSteps[idx] = e.target.value;
                      setGradingPolicyForm({...gradingPolicyForm, steps: newSteps});
                    }} 
                    placeholder="VD: **Tiêu đề:** Nội dung bước" 
                    required 
                  />
                  <button type="button" className="btn-danger btn-small" onClick={() => {
                    const newSteps = [...gradingPolicyForm.steps];
                    newSteps.splice(idx, 1);
                    setGradingPolicyForm({...gradingPolicyForm, steps: newSteps});
                  }}><i className="fa-solid fa-trash"></i></button>
                </div>
              ))}
            </div>

            <h4 style={{marginTop: '2rem', marginBottom: '1rem', borderBottom: '1px solid var(--glass-border)', paddingBottom: '0.5rem'}}>Thông tin Liên hệ</h4>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '1rem'}}>
              <div className="input-group">
                <label>Hotline/Zalo</label>
                <input type="text" value={gradingPolicyForm.phone} onChange={e => setGradingPolicyForm({...gradingPolicyForm, phone: e.target.value})} required />
              </div>
              <div className="input-group">
                <label>Fanpage</label>
                <input type="text" value={gradingPolicyForm.facebook} onChange={e => setGradingPolicyForm({...gradingPolicyForm, facebook: e.target.value})} required />
              </div>
            </div>
            <div className="input-group">
              <label>Địa chỉ cửa hàng</label>
              <input type="text" value={gradingPolicyForm.address} onChange={e => setGradingPolicyForm({...gradingPolicyForm, address: e.target.value})} required />
            </div>

            <div style={{marginTop: '2rem', textAlign: 'right'}}>

// ==========================================
// MAIN APP COMPONENT (ROUTER)
// ==========================================
const App = () => {
  const [currentView, setCurrentView] = useState('STOREFRONT');
  const [token, setToken] = useState(localStorage.getItem('adminToken'));

  const navigateTo = (view) => setCurrentView(view);

  const handleLoginSuccess = (newToken) => {
    localStorage.setItem('adminToken', newToken);
    setToken(newToken);
    setCurrentView('ADMIN_DASHBOARD');
  };

  const handleLogout = () => {
    localStorage.removeItem('adminToken');
    setToken(null);
    setCurrentView('STOREFRONT');
  };

  // Check if trying to access dashboard without token
  useEffect(() => {
    if (currentView === 'ADMIN_DASHBOARD' && !token) {
      setCurrentView('ADMIN_LOGIN');
    }
  }, [currentView, token]);

  if (currentView === 'STOREFRONT') return <Storefront navigateTo={navigateTo} />;
  if (currentView === 'ADMIN_LOGIN') {
    if (token) {
      setCurrentView('ADMIN_DASHBOARD');
      return null;
    }
    return <AdminLogin navigateTo={navigateTo} onLoginSuccess={handleLoginSuccess} />;
  }
  if (currentView === 'ADMIN_DASHBOARD') return <AdminDashboard navigateTo={navigateTo} token={token} onLogout={handleLogout} />;

  return null;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
